# Боевой сайт VOLUME.
# Положить в /etc/nginx/sites-available/volume и включить симлинком.
server {
    listen 80;
    listen [::]:80;

    # Пока домена нет — оставьте _ (означает «любое имя»).
    # Когда купите домен, замените на: server_name volume-studio.ru www.volume-studio.ru;
    server_name _;

    root /var/www/volume;
    index index.html;

    # Логи отдельно по сайту — проще искать проблемы
    access_log /var/log/nginx/volume.access.log;
    error_log  /var/log/nginx/volume.error.log;

    # Статика сайта
    location / {
        try_files $uri $uri/ =404;
    }

    # Обработчик формы заявки (PHP)
    location ~ ^/api/.+\.php$ {
        include snippets/fastcgi-php.conf;
        # ВАЖНО: версия PHP должна совпадать с установленной.
        # Проверить:  ls /run/php/
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    # Картинки и стили кэшируем в браузере на месяц
    location ~* \.(jpg|jpeg|png|webp|avif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Служебные файлы наружу не отдаём
    location ~ /\.(git|env|htpasswd) {
        deny all;
        return 404;
    }

    # Сжатие
    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 1024;
}
