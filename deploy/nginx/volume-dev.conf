# Dev-версия сайта: копия для экспериментов.
# Положить в /etc/nginx/sites-available/volume-dev
server {
    listen 80;
    listen [::]:80;

    # Работает только по поддомену. Без домена можно временно слушать
    # отдельный порт: замените listen 80 на listen 8080 и уберите server_name.
    server_name dev.ВАШ-ДОМЕН.ru;

    root /var/www/volume-dev;
    index index.html;

    access_log /var/log/nginx/volume-dev.access.log;
    error_log  /var/log/nginx/volume-dev.error.log;

    # Пароль на вход: чтобы чужие не видели недоделанное
    auth_basic "Dev version";
    auth_basic_user_file /etc/nginx/.htpasswd-dev;

    # Запрет индексации поисковиками — чтобы копия не попала в выдачу
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ ^/api/.+\.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        # dev-заявки уходят в отдельный чат (см. /etc/volume/bot-dev.env)
        fastcgi_param VOLUME_ENV dev;
    }

    location ~ /\.(git|env|htpasswd) {
        deny all;
        return 404;
    }
}
